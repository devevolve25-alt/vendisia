<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | ExplorIA - Perícia Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="exploria-style.css">
</head>
<body>

    <header class="page-header">
        <div class="brand-block">
            <img src="merc_face.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand-text-wrapper">
                <span class="brand-name">VENDISIA</span>
                <span class="brand-tagline">IA ECOSYSTEM</span>
            </div>
        </div>
        <h2 class="header-headline">Detecte as falhas que estão drenando seu ROI.</h2>
        <div class="spacer"></div>
    </header>

    <main class="main-stage">
        <div class="radar-bg">
            <div class="radar-sweep" id="sweep"></div>
        </div>

        <section class="central-chat">
            <div class="chat-header">
                <h1>PROTOCOLO DE VARREDURA: EXPLORIA</h1>
            </div>
            
            <div class="chat-display" id="chat-output">
                <div class="msg-bot" id="initial-message">
                    Iniciando protocolo de análise técnica. Forneça a URL do site ou @ do Instagram para perícia.
                </div>
            </div>

            <div class="chat-input-area">
                <textarea class="url-input" id="user-target" placeholder="Ex: @clinicaestetica ou www.site.com.br" rows="1"></textarea>
                <button class="btn-scan" onclick="processAudit()">EXECUTAR VARREDURA</button>
            </div>
        </section>
    </main>

    <script src="exploria-script.js"></script>
</body>
</html>
