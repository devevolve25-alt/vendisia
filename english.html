<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | English Training</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --sidebar-bg: #0a0a0a;
            --card-bg: #0c1320;
            --gold: #d4af37;
            --cyan: #00ffff;
            --text-white: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .main-header {
            height: 80px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .brand-name { font-family: 'Bebas Neue'; font-size: 2.2rem; color: var(--gold); letter-spacing: 2px; }
        .brand-tagline { font-family: 'Bebas Neue'; font-size: 1rem; letter-spacing: 4px; margin-left: 12px; }

        /* CONTAINER */
        .app-container { display: flex; flex: 1; height: calc(100vh - 80px); }

        /* SIDEBAR CHAT (ADMIN ONLY) */
        .sidebar-chat {
            width: 400px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .sidebar-chat.hidden { display: none; }

        .sidebar-header { padding: 30px; border-bottom: 1px solid var(--border); }
        .sidebar-header h3 { font-family: 'Bebas Neue'; color: var(--gold); font-size: 1.6rem; }

        .chat-history { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg-bot { background: rgba(255,255,255,0.04); padding: 20px; border-radius: 12px; font-size: 1.1rem; border-left: 4px solid var(--gold); line-height: 1.6; }
        .msg-user { background: var(--gold); color: #000; padding: 15px 20px; border-radius: 12px; align-self: flex-end; font-size: 1rem; font-weight: 600; }

        .chat-input-area { padding: 25px; border-top: 1px solid var(--border); background: #050505; }
        #ai-command { 
            width: 100%; background: #111; border: 1px solid #444; border-radius: 10px; 
            padding: 15px; color: white; resize: none; margin-bottom: 15px; font-family: inherit; font-size: 1.1rem;
        }
        #btn-generate { 
            width: 100%; background: var(--gold); color: #000; border: none; 
            padding: 15px; font-family: 'Bebas Neue'; font-size: 1.5rem; cursor: pointer; border-radius: 10px;
        }

        /* MAIN DISPLAY */
        .main-display { flex: 1; display: flex; flex-direction: column; background: #020202; overflow: hidden; }
        .tab-nav { display: flex; background: #080808; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-btn { 
            flex: 1; padding: 20px; background: none; border: none; color: #666; 
            font-family: 'Bebas Neue'; font-size: 1.4rem; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { color: var(--gold); border-bottom: 3px solid var(--gold); background: rgba(212, 175, 55, 0.08); }

        .tab-content { flex: 1; padding: 40px; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        /* CONTENT STYLING */
        .content-body { font-size: 1.3rem; line-height: 1.9; color: var(--text-white); max-width: 900px; margin: 0 auto; }
        .exercise-card { background: var(--card-bg); padding: 35px; border-radius: 20px; margin-bottom: 30px; border-left: 6px solid var(--gold); }
        .exercise-card strong { display: block; margin-bottom: 10px; color: var(--gold); font-size: 1.3rem; }
        .exercise-card p { font-size: 1.2rem; margin-bottom: 15px; }
        
        .ans-input { 
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; 
            padding: 18px; color: white; border-radius: 8px; margin-top: 15px; outline: none; font-size: 1.1rem;
        }
        .ans-input:focus { border-color: var(--gold); }

        .btn-primary { 
            background: var(--cyan); color: #000; border: none; padding: 20px; 
            font-family: 'Bebas Neue'; font-size: 1.6rem; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 20px;
        }

        .empty-state { text-align: center; margin-top: 100px; opacity: 0.4; font-style: italic; font-size: 1.3rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="brand-block">
            <span class="brand-name">VENDISIA</span>
            <span class="brand-tagline">ENGLISH MODULE</span>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar-chat hidden" id="admin-sidebar">
            <div class="sidebar-header">
                <h3>AI INSTRUCTIONS</h3>
            </div>
            <div class="chat-history" id="chat-history">
                <div class="msg-bot">Admin Mode Active. Ready to create your next lesson.</div>
            </div>
            <div class="chat-input-area">
                <textarea id="ai-command" placeholder="Type instructions..." rows="2"></textarea>
                <button id="btn-generate" onclick="generateContent()">GENERATE</button>
            </div>
        </aside>

        <main class="main-display">
            <nav class="tab-nav">
                <button class="tab-btn active" onclick="openTab(event, 'lesson')">LESSON</button>
                <button class="tab-btn" onclick="openTab(event, 'exercises')">EXERCISES</button>
                <button class="tab-btn" onclick="openTab(event, 'feedback')">FEEDBACK</button>
            </nav>

            <div id="lesson" class="tab-content active">
                <div class="empty-state">Loading lesson...</div>
            </div>

            <div id="exercises" class="tab-content">
                <div id="exercise-list"></div>
                <button id="btn-save-answers" class="btn-primary hidden" onclick="saveAnswers()">SUBMIT ANSWERS</button>
            </div>

            <div id="feedback" class="tab-content">
                <div class="empty-state">Feedback will appear here.</div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://htsorgukdbfuuypiuksm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8bpn_JEYZU2YzVMC5UK3CA_9Kn4LPdm';
        const WEBHOOK_IA = 'https://powerfulkiwi-n8n.cloudfy.live/webhook/english_module_vendisia';

        let lastRecordId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') {
                document.getElementById('admin-sidebar').classList.remove('hidden');
            }
            loadLatestLesson();
        });

        function openTab(evt, tabId) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            const tabs = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabs.length; i++) tabs[i].className = tabs[i].className.replace(" active", "");
            document.getElementById(tabId).style.display = "block";
            evt.currentTarget.className += " active";
        }

        async function loadLatestLesson() {
            try {
                // Busca a última aula criada na tabela
                const res = await fetch(`${SUPABASE_URL}/rest/v1/modulo_treinamento?select=*&order=created_at.desc&limit=1`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                if (data.length > 0) {
                    const lesson = data[0];
                    lastRecordId = lesson.id;
                    renderLesson(lesson);
                }
            } catch (e) { console.error("Error loading lesson", e); }
        }

        function renderLesson(lesson) {
            document.getElementById('lesson').innerHTML = `<div class="content-body">${lesson.conteudo}</div>`;
            const exContainer = document.getElementById('exercise-list');
            exContainer.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                if (lesson[`statm${i}`]) {
                    exContainer.innerHTML += `
                        <div class="exercise-card">
                            <strong>Question ${i}</strong>
                            <p>${lesson[`statm${i}`]}</p>
                            <input type="text" class="ans-input" id="field-answr${i}" value="${lesson[`answr${i}`] || ''}">
                        </div>`;
                }
            }
            document.getElementById('btn-save-answers').classList.remove('hidden');
        }

        async function generateContent() {
            const cmd = document.getElementById('ai-command').value;
            if (!cmd) return;
            // Feedback chat
            const history = document.getElementById('chat-history');
            const uMsg = document.createElement('div');
            uMsg.className = 'msg-user'; uMsg.innerText = cmd;
            history.appendChild(uMsg);
            document.getElementById('ai-command').value = "";

            try {
                await fetch(WEBHOOK_IA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instruction: cmd })
                });
                // Aguarda um pouco e recarrega a última aula
                setTimeout(loadLatestLesson, 3000);
            } catch (e) { alert("IA Error"); }
        }

        async function saveAnswers() {
            if (!lastRecordId) return;
            const updateData = {};
            for (let i = 1; i <= 5; i++) {
                const input = document.getElementById(`field-answr${i}`);
                if (input) updateData[`answr${i}`] = input.value;
            }
            await fetch(`${SUPABASE_URL}/rest/v1/modulo_treinamento?id=eq.${lastRecordId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(updateData)
            });
            alert("Answers saved!");
        }
    </script>
</body>
</html>
