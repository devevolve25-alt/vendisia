<section class="test-chat-section" style="padding: 40px 20px; max-width: 800px; margin: 0 auto;">
    <h2 style="text-align: center; font-family: 'Bebas Neue', sans-serif; color: #2ecc71; font-size: 2.5rem; letter-spacing: 2px;">TESTE A MERCURIA AGORA</h2>
    <p style="text-align: center; color: #888; margin-bottom: 30px;">Experimente a inteligência que vai gerir seu negócio.</p>

    <div class="chat-column" style="background: #1e1e1e; border: 1px solid #333; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; height: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <div class="chat-header" style="background: #2ecc71; color: #000; padding: 15px; font-weight: bold; text-align: center; font-family: 'Montserrat', sans-serif;">
            MERCURIA | AMBIENTE DE TESTE
        </div>
        
        <div class="chat-messages" id="chat-teste" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #121212;">
            <div class="msg-bot" style="background: #2a2a2a; color: #fff; padding: 10px 15px; border-radius: 10px 10px 10px 0; align-self: flex-start; max-width: 80%; font-size: 0.9rem; border: 1px solid #333;">
                Olá! Eu sou a MercurIA. Este é um ambiente de demonstração. Como posso te ajudar?
            </div>
        </div>

        <div class="input-area" style="padding: 15px; background: #1e1e1e; display: flex; gap: 10px; border-top: 1px solid #333;">
            <textarea id="cmd-input-teste" placeholder="Diga algo como 'Quais são os serviços?'" style="flex: 1; background: #000; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 10px; resize: none; font-family: inherit; height: 45px;"></textarea>
            <button onclick="falarComIA_Teste()" style="background: #2ecc71; color: #000; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Bebas Neue'; font-size: 1rem;">ENVIAR</button>
        </div>
    </div>
</section>

<script>
async function falarComIA_Teste() {
    const input = document.getElementById('cmd-input-teste');
    const chat = document.getElementById('chat-teste');
    const msg = input.value.trim();

    if(!msg) return;

    // Mensagem do Usuário
    const divUser = document.createElement('div');
    divUser.style = "background: #2ecc71; color: #000; padding: 10px 15px; border-radius: 10px 10px 0 10px; align-self: flex-end; max-width: 80%; font-weight: 500; font-size: 0.9rem;";
    divUser.innerText = msg;
    chat.appendChild(divUser);
    
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    // Balão de resposta da MercurIA
    const divBot = document.createElement('div');
    divBot.style = "background: #2a2a2a; color: #fff; padding: 10px 15px; border-radius: 10px 10px 10px 0; align-self: flex-start; max-width: 80%; font-size: 0.9rem; border: 1px solid #333;";
    divBot.innerText = "...";
    chat.appendChild(divBot);

    try {
        const response = await fetch('https://powerfulkiwi-n8n.cloudfy.live/webhook/3dd98c18-d95d-43b5-bafa-fcde2a305983', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                mensagem: msg,
                salao_id: "TESTE_LANDING_PAGE", // Enviando um ID fixo para identificar que vem da Index
                origem: "landing_page"
            })
        });

        const data = await response.json();
        divBot.innerText = data.output || data.resposta || data.text || "Estou pronta para gerenciar sua agenda!";

    } catch (error) {
        divBot.innerText = "Ops! No momento estou em manutenção. Tente novamente em instantes.";
    }

    chat.scrollTop = chat.scrollHeight;
}

// Permitir enviar com Enter
document.getElementById('cmd-input-teste')?.addEventListener('keypress', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        falarComIA_Teste();
    }
});
</script>
