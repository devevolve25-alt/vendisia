<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | ExplorIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --prospect-color: #32ff7e; /* Verde Perícia */
            --accent-glow: rgba(50, 255, 126, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a150f 0%, #000 100%);
        }

        /* HEADER PADRONIZADO VENDISIA */
        .page-header {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .brand-block { display: flex; align-items: center; gap: 15px; }
        .brand-logo { width: 50px; height: auto; }
        .brand-text-wrapper { display: flex; flex-direction: column; }
        .brand-name { font-family: 'Bebas Neue'; font-size: 2.5rem; color: var(--prospect-color); line-height: 0.9; letter-spacing: 2px; }
        .brand-tagline { font-family: 'Bebas Neue'; font-size: 1.2rem; color: #fff; letter-spacing: 4px; margin-top: 5px; }

        /* CONTAINER CENTRAL DE DIAGNÓSTICO */
        .main-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* EFEITO DE RADAR AO FUNDO */
        .radar-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            border: 1px solid rgba(50, 255, 126, 0.1);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border-top: 2px solid var(--prospect-color);
            opacity: 0.3;
            animation: rotate 4s linear infinite;
            display: none;
        }

        /* ESTILIZAÇÃO DOS LINKS COMO BOTÕES */
        .msg-bot a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: var(--prospect-color);
            color: #000 !important;
            text-decoration: none;
            border-radius: 6px;
            font-family: 'Bebas Neue';
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .msg-bot a:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* CAIXA DE CHAT CENTRALIZADA */
        .central-chat {
            width: 100%;
            max-width: 550px;
            background: rgba(12, 20, 16, 0.8);
            border: 1px solid rgba(50, 255, 126, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(50, 255, 126, 0.1);
            text-align: center;
        }

        .chat-header h1 { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--prospect-color); letter-spacing: 2px; }

        .chat-display {
            height: 300px;
            padding: 25px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .msg-bot { margin-bottom: 20px; border-left: 2px solid var(--prospect-color); padding-left: 15px; }
        .msg-user { color: var(--prospect-color); font-weight: 600; text-align: right; margin-bottom: 20px; }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .url-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(50, 255, 126, 0.2);
            border-radius: 6px;
            padding: 15px;
            color: #fff;
            font-family: 'Montserrat';
            text-align: center;
            outline: none;
        }

        .btn-scan {
            background: var(--prospect-color);
            color: #000;
            border: none;
            padding: 15px;
            font-family: 'Bebas Neue';
            font-size: 1.4rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-scan:hover { filter: brightness(1.2); transform: translateY(-2px); }

        @media (max-width: 600px) {
            .radar-bg { width: 300px; height: 300px; }
            .central-chat { width: 95%; }
            .brand-name { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <div class="brand-block">
            <img src="merc_face.png" alt="Logo" class="brand-logo">
            <div class="brand-text-wrapper">
                <span class="brand-name">VENDISIA</span>
                <span class="brand-tagline">IA ECOSYSTEM</span>
            </div>
        </div>
    </header>

    <main class="main-stage">
        <div class="radar-bg">
            <div class="radar-sweep" id="sweep"></div>
        </div>

        <section class="central-chat">
            <div class="chat-header">
                <h1>EU SOU EXPLORIA</h1>
            </div>
            
            <div class="chat-display" id="chat-output">
                <div class="msg-bot">Iniciando protocolo de análise técnica. Forneça o url do site ou @ do instragram.</div>
            </div>

            <div class="chat-input-area">
                <input type="text" class="url-input" id="user-target" placeholder="Ex: @clinicaestetica ou www.site.com.br">
                <button class="btn-scan" onclick="processAudit()">EXECUTAR VARREDURA</button>
            </div>
        </section>
    </main>

    <script>
    async function processAudit() {
        const target = document.getElementById('user-target').value;
        const chat = document.getElementById('chat-output');
        const sweep = document.getElementById('sweep');

        if (!target) return;

        sweep.style.display = "block";

        const uMsg = document.createElement('div');
        uMsg.className = 'msg-user';
        uMsg.innerText = "Analisar: " + target;
        chat.appendChild(uMsg);
        document.getElementById('user-target').value = "";
        chat.scrollTop = chat.scrollHeight;

        const bMsgLoading = document.createElement('div');
        bMsgLoading.className = 'msg-bot';
        bMsgLoading.innerHTML = "<b>[EXPLORIA]:</b> Alvo identificado. Acessando infraestrutura digital... Analisando latência e funil de conversão.";
        chat.appendChild(bMsgLoading);

        try {
            const WEBHOOK_URL = "https://powerfulkiwi-n8n.cloudfy.live/webhook/21abc95d-7b3c-4cc6-b2b8-e33a696d6f96"; 

            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    target: target,
                    entity: "ExplorIA",
                    timestamp: new Date().toISOString()
                })
            });

            const data = await response.json();

            const bMsgResult = document.createElement('div');
            bMsgResult.className = 'msg-bot';
            // innerHTML permite que o link enviado pelo n8n vire um botão clicável
            bMsgResult.innerHTML = `<b>[STATUS]:</b> ${data.output || "Varredura concluída. Dados processados."}`;
            chat.appendChild(bMsgResult);

        } catch (error) {
            console.error("Erro na perícia:", error);
            const eMsg = document.createElement('div');
            eMsg.className = 'msg-bot';
            eMsg.style.color = "#ff4d4d";
            eMsg.innerText = "[ERRO]: Falha na conexão com o núcleo de processamento.";
            chat.appendChild(eMsg);
        } finally {
            sweep.style.display = "none";
            chat.scrollTop = chat.scrollHeight;
        }
    }
</script>
</body>
</html>
