<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Administrativo | IA Agendamentos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body { background-color: #121212 !important; color: white !important; font-family: sans-serif; }
        .loader-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; }
        .pai-card { border: 1px solid #333; margin: 10px; padding: 15px; border-radius: 10px; background: #1e1e1e; }
        .filhos-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .filho-card { flex: 1; min-width: 140px; background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; }
        .wide { flex-basis: 100%; }
        .valor-central { font-size: 1.2rem; font-weight: bold; color: #2ecc71; }
        .btn-config-ia { background: #2ecc71; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div id="loader" class="loader-overlay">Carregando...</div>

    <header style="padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 id="display-nome-fantasia" style="font-size: 1.2rem; margin: 0; color: #2ecc71;">CARREGANDO...</h1>
            <small>DASHBOARD ADMINISTRATIVO</small>
        </div>
        <select id="select-salao" style="background: #333; color: white; border-radius: 5px; padding: 8px; border: 1px solid #444;">
            <option value="">Selecionar Unidade</option>
        </select>
    </header>

    <main class="dash-content">
        <section class="pai-card">
            <h2 class="pai-title">Faturamento (Movimentações)</h2>
            <div class="filhos-grid">
                <div class="filho-card">
                    <span class="label-sup">Hoje</span>
                    <div class="valor-central" id="fat-hoje">R$ 0,00</div>
                </div>
                <div class="filho-card">
                    <span class="label-sup">Semana</span>
                    <div class="valor-central" id="fat-semana">R$ 0,00</div>
                </div>
                <div class="filho-card wide">
                    <span class="label-sup">Total do Mês</span>
                    <div class="valor-central" id="fat-mes">R$ 0,00</div>
                </div>
            </div>
        </section>

        <section class="pai-card">
            <h2 class="pai-title">Agendamentos (IA vs Manual)</h2>
            <div class="filhos-grid">
                <div class="filho-card">
                    <span class="label-sup">IA (Hoje)</span>
                    <div class="valor-central" id="ag-ia-hoje">0</div>
                </div>
                <div class="filho-card">
                    <span class="label-sup">Manual (Hoje)</span>
                    <div class="valor-central" id="ag-man-hoje">0</div>
                </div>
            </div>
        </section>

        <section class="pai-card">
            <h2 class="pai-title">Status da MercurIA</h2>
            <div class="filho-card wide">
                <label style="font-size: 0.7rem; color: #888; display: block; margin-bottom: 5px;">SAUDAÇÃO PERSONALIZADA DA IA</label>
                <textarea id="ia-saudacao-input" rows="3" style="width: 100%; box-sizing: border-box; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 8px; padding: 12px; margin-bottom: 15px;"></textarea>
                <button id="btn-salvar-ia" class="btn-config-ia">SALVAR CONFIGURAÇÃO IA</button>
            </div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
