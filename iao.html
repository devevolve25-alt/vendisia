<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | IAO</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --chat-bg: #0c1320;
            --iao-color: #a55eea; /* Violeta Elétrico */
            --terminal-green: #00ff41;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        /* Header Padrão Vendisia */
        .page-header {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 15px auto;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
        }

        .brand-block { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 45px; height: auto; }
        .brand-text-wrapper { display: flex; flex-direction: column; }
        .brand-name { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--iao-color); line-height: 0.9; letter-spacing: 2px; }
        .brand-tagline { font-family: 'Bebas Neue'; font-size: 0.9rem; color: #fff; letter-spacing: 3px; margin-top: 3px; }
        .header-headline { font-family: 'Bebas Neue'; font-size: 1.2rem; text-align: center; color: #fff; opacity: 0.8; }

        .studio-container {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            min-height: 0;
        }

        /* Coluna de Chat */
        .chat-column {
            background: var(--chat-bg);
            border: 1px solid rgba(165, 94, 234, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px;
            background: rgba(165, 94, 234, 0.1);
            border-bottom: 1px solid rgba(165, 94, 234, 0.2);
            font-family: 'Bebas Neue';
            font-size: 1.1rem;
            color: var(--iao-color);
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bot { border-left: 2px solid var(--iao-color); padding-left: 10px; color: #cbd5e1; }
        .msg-user { color: var(--iao-color); font-weight: 600; text-align: right; }

        .input-area {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(165, 94, 234, 0.2);
            border-radius: 4px;
            padding: 10px;
            color: white;
            font-family: 'Montserrat';
            resize: none;
            height: 70px;
            outline: none;
        }

        .btn-generate {
            background: var(--iao-color);
            color: #000;
            border: none;
            padding: 10px;
            font-family: 'Bebas Neue';
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Coluna de Preview Técnico */
        .preview-column {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-tabs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0 15px;
        }

        .tab-active {
            padding: 12px 20px;
            font-family: 'Bebas Neue';
            color: var(--iao-color);
            border-bottom: 2px solid var(--iao-color);
        }

        .btn-download {
            background: transparent;
            border: 1px solid var(--iao-color);
            color: var(--iao-color);
            padding: 5px 15px;
            font-family: 'Bebas Neue';
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-download:hover { background: var(--iao-color); color: #000; }

        .display-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #050505;
            display: flex;
            justify-content: center;
        }

        /* Visualizador de Código/Texto Puro */
        .iao-terminal {
            background: #0a0a0a;
            color: var(--terminal-green);
            width: 100%;
            max-width: 900px;
            padding: 30px;
            border: 1px solid #222;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-radius: 4px;
        }

        @media (max-width: 1000px) {
            body { overflow-y: auto; height: auto; }
            .studio-container { grid-template-columns: 1fr; }
            .chat-column { height: 400px; }
            .preview-column { min-height: 500px; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <div class="brand-block">
            <img src="merc_face.png" alt="Logo" class="brand-logo">
            <div class="brand-text-wrapper">
                <span class="brand-name">VENDISIA</span>
                <span class="brand-tagline">IA ECOSYSTEM</span>
            </div>
        </div>
        <h2 class="header-headline">Laboratório de Operações IAO</h2>
        <div class="spacer"></div>
    </header>

    <main class="studio-container">
        <section class="chat-column">
            <div class="chat-header">TERMINAL OPERACIONAL</div>
            <div class="chat-messages" id="chat-iao">
                <div class="msg-bot">Sistemas ativos. Sou IAO. Insira os parâmetros para codificação ou análise técnica.</div>
            </div>
            <div class="input-area">
                <textarea id="cmd-input" placeholder="Insira o comando técnico..."></textarea>
                <button class="btn-generate" id="btn-submit">EXECUTAR COMANDO</button>
            </div>
        </section>

        <section class="preview-column">
            <div class="preview-tabs">
                <div class="tab-active">SAÍDA TÉCNICA (.TXT)</div>
                <button class="btn-download" onclick="downloadTxt()">BAIXAR CÓDIGO (.TXT)</button>
            </div>
            
            <div class="display-area">
                <pre class="iao-terminal" id="text-view">Aguardando processamento de dados...</pre>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const btn = document.getElementById('btn-submit');
            const inputField = document.getElementById('cmd-input');

            // Evento de Click
            btn.addEventListener('click', generateContent);

            // Evento de Enter
            inputField.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    generateContent();
                }
            });
        });

        async function generateContent() {
            const inputField = document.getElementById('cmd-input');
            const input = inputField.value.trim();
            const chat = document.getElementById('chat-iao');
            const textView = document.getElementById('text-view');

            if(!input) return;

            // Log de usuário
            const userDiv = document.createElement('div');
            userDiv.className = 'msg-user';
            userDiv.innerText = input;
            chat.appendChild(userDiv);
            
            inputField.value = "";
            chat.scrollTop = chat.scrollHeight;

            const botDivLoading = document.createElement('div');
            botDivLoading.className = 'msg-bot';
            botDivLoading.innerText = "[IAO]: Processando requisição técnica e gerando saída limpa...";
            chat.appendChild(botDivLoading);

            try {
                const WEBHOOK_URL_IAO = "https://powerfulkiwi-n8n.cloudfy.live/webhook/web_programing"; 

                const response = await fetch(WEBHOOK_URL_IAO, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: input,
                        entity: "IAO",
                        timestamp: new Date().toISOString()
                    })
                });

                const data = await response.json();

                const botDivSuccess = document.createElement('div');
                botDivSuccess.className = 'msg-bot';
                botDivSuccess.innerText = "[IAO]: Operação concluída. Código disponível no terminal.";
                chat.appendChild(botDivSuccess);

                // Exibe como innerText para preservar a pureza do código
                if (data.output) {
                    textView.innerText = data.output;
                } else if (data.message) {
                    textView.innerText = data.message;
                }

            } catch (error) {
                const eDiv = document.createElement('div');
                eDiv.className = 'msg-bot';
                eDiv.style.color = "#ff4d4d";
                eDiv.innerText = "[ERRO]: Falha na comunicação com o núcleo operacional.";
                chat.appendChild(eDiv);
            } finally {
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function downloadTxt() {
            const content = document.getElementById('text-view').innerText;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'iao_output_' + new Date().getTime() + '.txt';
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
