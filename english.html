<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Training</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --sidebar-bg: #0a0a0a;
            --card-bg: #0c1320;
            --gold: #d4af37;
            --cyan: #00ffff;
            --text-white: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .main-header {
            height: 80px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .brand-name { font-family: 'Bebas Neue'; font-size: 2.2rem; color: var(--gold); letter-spacing: 2px; }
        .app-container { display: flex; flex: 1; height: calc(100vh - 80px); }
        .sidebar-chat { width: 420px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-chat.hidden { display: none; }
        .chat-history { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg-bot { background: rgba(255,255,255,0.04); padding: 20px; border-radius: 12px; border-left: 4px solid var(--gold); }
        .msg-user { background: var(--gold); color: #000; padding: 15px 20px; border-radius: 12px; align-self: flex-end; font-weight: 600; }
        .chat-input-area { padding: 25px; border-top: 1px solid var(--border); background: #050505; }
        #ai-command { width: 100%; background: #111; border: 1px solid #444; border-radius: 10px; padding: 15px; color: white; resize: none; margin-bottom: 15px; }
        #btn-generate { width: 100%; background: var(--gold); color: #000; border: none; padding: 15px; font-family: 'Bebas Neue'; font-size: 1.5rem; cursor: pointer; border-radius: 10px; }
        .main-display { flex: 1; display: flex; flex-direction: column; background: #020202; overflow: hidden; }
        .tab-nav { display: flex; background: #080808; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 20px; background: none; border: none; color: #666; font-family: 'Bebas Neue'; font-size: 1.4rem; cursor: pointer; }
        .tab-btn.active { color: var(--gold); border-bottom: 3px solid var(--gold); }
        .tab-content { flex: 1; padding: 50px; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }
        .content-body { font-size: 1.35rem; line-height: 1.9; max-width: 950px; margin: 0 auto; }
        .exercise-card { background: var(--card-bg); padding: 40px; border-radius: 20px; margin-bottom: 30px; border-left: 6px solid var(--gold); }
        .ans-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; padding: 20px; color: white; border-radius: 10px; margin-top: 15px; font-size: 1.2rem; }
        .btn-primary { background: var(--cyan); color: #000; border: none; padding: 20px; font-family: 'Bebas Neue'; font-size: 1.6rem; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 25px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="main-header">
        <span class="brand-name">LANGUAGE DEVELOPMENT</span>
    </header>

    <div class="app-container">
        <aside class="sidebar-chat hidden" id="admin-sidebar">
            <div class="chat-history" id="chat-history">
                <div class="msg-bot">Admin Mode Active.</div>
            </div>
            <div class="chat-input-area">
                <textarea id="ai-command" placeholder="Lesson instructions..." rows="2"></textarea>
                <button id="btn-generate" onclick="generateContent()">GENERATE LESSON</button>
            </div>
        </aside>

        <main class="main-display">
            <nav class="tab-nav">
                <button class="tab-btn active" onclick="openTab(event, 'lesson')">LESSON</button>
                <button class="tab-btn" onclick="openTab(event, 'exercises')">EXERCISES</button>
                <button class="tab-btn" onclick="openTab(event, 'writing')">WRITING</button>
                <button class="tab-btn" onclick="openTab(event, 'feedback')">FEEDBACK</button>
            </nav>

            <div id="lesson" class="tab-content active"></div>
            <div id="exercises" class="tab-content">
                <div id="exercises" class="tab-content">
                
                <div id="exercise-list"></div>
                <button id="btn-save-answers" class="btn-primary" onclick="saveAnswers()">SUBMIT MY ANSWERS</button>
            </div>
                <div id="exercise-list"></div>
                <button id="btn-save-answers" class="btn-primary" onclick="saveAnswers()">SUBMIT MY ANSWERS</button>
            </div>
            <div id="writing" class="tab-content">
                <div class="content-body">
                    <h2>Your Writing Exercise</h2>
                    <textarea id="field-writing" class="ans-input" rows="10" placeholder="Write your text here..."></textarea>
                    <button id="btn-save-writing" class="btn-primary" onclick="saveWriting()">SUBMIT WRITING</button>
                </div>
            </div>
            <div id="feedback" class="tab-content">
                <div id="feedback-area" class="content-body">Your feedback will appear here.</div>
                <button id="btn-request-feedback" class="btn-primary" onclick="requestManualFeedback()">REQUEST FEEDBACK FROM AI</button>
            </nav>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://htsorgukdbfuuypiuksm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8bpn_JEYZU2YzVMC5UK3CA_9Kn4LPdm';
        const WEBHOOK_IA = 'https://powerfulkiwi-n8n.cloudfy.live/webhook/english_page';

        let lastRecordName = null; // Armazena o 'nome' da lição (TEXT) da tabela modulo_treinamento
        let currentStudentName = null; // **NOVO:** Armazena o nome do aluno atual (TEXT)

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') document.getElementById('admin-sidebar').classList.remove('hidden');
            
            // **IMPORTANTE:** Para um sistema real, currentStudentName viria de um sistema de autenticação,
            // um parâmetro de URL ou um input. Aqui, vamos assumir que ele pode ser predefinido para testes
            // ou virá da resposta do webhook da IA ao gerar a lição.
            // Por exemplo, para testes:
            // currentStudentName = "AlunoDeTeste"; 

            loadLatestLesson();
        });

        function openTab(evt, tabId) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            const tabs = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
            document.getElementById(tabId).style.display = "block";
            if(evt) evt.currentTarget.classList.add("active");
        }

        async function loadLatestLesson() {
            try {
                // 1. Carregar a lição principal de modulo_treinamento
                const resLesson = await fetch(`${SUPABASE_URL}/rest/v1/modulo_treinamento?select=*,nome&order=created_at.desc&limit=1`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const dataLesson = await resLesson.json();

                if (dataLesson.length > 0) {
                    const lesson = dataLesson[0];
                    lastRecordName = lesson.nome; // Guarda o 'nome' da lição

                    // **IMPORTANTE:** Se currentStudentName não estiver definido aqui, não podemos carregar as respostas específicas do aluno.
                    // Para fins de demonstração, se ele ainda não foi definido (ex: via geração de lesson), ele precisa de um valor.
                    // Em um cenário real, um aluno autenticado teria seu nome disponível.
                    if (!currentStudentName) {
                        console.warn("currentStudentName não definido. Não será possível carregar respostas específicas do aluno.");
                        // Pode-se definir um valor padrão ou exigir que o aluno se identifique.
                        // Exemplo para um comportamento mais robusto:
                        // alert("Por favor, identifique-se ou gere uma lição para continuar.");
                        // return; // Interrompe se o nome do aluno for essencial
                    }
                    
                    // 2. Carregar as respostas da tabela mod_treinamento_answers para esta lição e este aluno
                    let answers = {};
                    if (currentStudentName) { // Apenas tenta carregar se o nome do aluno estiver disponível
                        const resAnswers = await fetch(`${SUPABASE_URL}/rest/v1/mod_treinamento_answers?select=*&lesson_title=eq.${lastRecordName}&nome_aluno=eq.${currentStudentName}`, {
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        });
                        const dataAnswers = await resAnswers.json();
                        if (dataAnswers.length > 0) {
                            answers = dataAnswers[0];
                        }
                    }
                    
                    renderLesson(lesson, answers);
                }
            } catch (e) { console.error("Error loading lesson or answers:", e); }
        }

        function renderLesson(lesson, answers = {}) {
            // Renderiza o conteúdo da lição
            document.getElementById('lesson').innerHTML = `<div class="content-body">${lesson.conteudo}</div>`;
            
            // Renderiza o feedback (ainda da tabela modulo_treinamento)
            if (lesson.feedback) document.getElementById('feedback-area').innerHTML = `<div class="content-body">${lesson.feedback}</div>`;
            else document.getElementById('feedback-area').innerText = "Your feedback will appear here.";

            // Renderiza os campos de exercício com respostas pré-preenchidas
            const exContainer = document.getElementById('exercise-list');
            exContainer.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                if (lesson[`statm${i}`]) { // Assumindo que statmX ainda vem de modulo_treinamento
                    exContainer.innerHTML += `
                        <div class="exercise-card">
                            <strong>Question ${i}:</strong> ${lesson[`statm${i}`]}
                            <input type="text" class="ans-input" id="field-answr${i}" value="${answers[`answr${i}`] || ''}">
                        </div>`;
                }
            }

            // Preenche o campo de writing
            document.getElementById('field-writing').value = answers.writing || '';
        }

        async function saveAnswers() {
            if (!lastRecordName) return alert("No lesson title found. Please generate or load a lesson first.");
            if (!currentStudentName) return alert("Student name not identified. Cannot save answers.");
            
            const updateData = {
                lesson_title: lastRecordName, // Vincula as respostas à lição pelo 'nome'
                nome_aluno: currentStudentName // **NOVO:** Identifica o aluno
            };
            for (let i = 1; i <= 10; i++) {
                const val = document.getElementById(`field-answr${i}`)?.value;
                if (val !== undefined) updateData[`answr${i}`] = val;
            }

            try {
                // Tenta buscar o registro existente para saber se deve atualizar (PATCH) ou criar (POST)
                const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/mod_treinamento_answers?select=nome_aluno&lesson_title=eq.${lastRecordName}&nome_aluno=eq.${currentStudentName}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const checkData = await checkRes.json();
                const recordExists = checkData.length > 0;

                let res;
                if (recordExists) {
                    // Se já existem respostas para esta lição e este aluno, atualize
                    res = await fetch(`${SUPABASE_URL}/rest/v1/mod_treinamento_answers?nome_aluno=eq.${currentStudentName}`, { // Filtra pela PK
                        method: 'PATCH',
                        headers: { 
                            'apikey': SUPABASE_KEY, 
                            'Authorization': `Bearer ${SUPABASE_KEY}`, 
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal' 
                        },
                        body: JSON.stringify(updateData)
                    });
                } else {
                    // Se não existem, crie um novo registro
                    res = await fetch(`${SUPABASE_URL}/rest/v1/mod_treinamento_answers`, {
                        method: 'POST',
                        headers: { 
                            'apikey': SUPABASE_KEY, 
                            'Authorization': `Bearer ${SUPABASE_KEY}`, 
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation' 
                        },
                        body: JSON.stringify(updateData)
                    });
                }

                if (res.ok) {
                    alert("Answers saved! Notifying AI and analyzing...");

                    // Limpa os campos após o salvamento
                    for (let i = 1; i <= 10; i++) {
                        const input = document.getElementById(`field-answr${i}`);
                        if(input) input.value = "";
                    }

                    try {
                        await fetch(WEBHOOK_IA, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                action: 'answers_submitted',
                                lessonTitle: lastRecordName,
                                studentName: currentStudentName // **NOVO:** Passa o nome do aluno
                            })
                        });
                        console.log("AI notified about answers submission.");
                    } catch (aiNotifyError) {
                        console.error("Error notifying AI about submission:", aiNotifyError);
                    }
                    
                    setTimeout(loadLatestLesson, 500); 
                    requestFeedback(); 

                } else {
                    const errorText = await res.text();
                    alert(`Error saving answers. Check Supabase RLS. Error: ${errorText}`);
                    console.error("Supabase Save Answers Error:", errorText);
                }
            } catch (e) { 
                console.error("Fetch Error in saveAnswers:", e); 
                alert("An error occurred while saving answers.");
            }
        }

        async function saveWriting() {
            if (!lastRecordName) return alert("No lesson title found. Please generate or load a lesson first.");
            if (!currentStudentName) return alert("Student name not identified. Cannot save writing.");

            const writingText = document.getElementById('field-writing').value;
            const updateData = {
                lesson_title: lastRecordName, 
                nome_aluno: currentStudentName, // **NOVO:** Identifica o aluno
                writing: writingText
            };

            try {
                // Tenta buscar o registro existente para saber se deve atualizar (PATCH) ou criar (POST)
                const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/mod_treinamento_answers?select=nome_aluno&lesson_title=eq.${lastRecordName}&nome_aluno=eq.${currentStudentName}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const checkData = await checkRes.json();
                const recordExists = checkData.length > 0;

                let res;
                if (recordExists) {
                    // Se já existem respostas para esta lição e este aluno, atualize o campo 'writing'
                    res = await fetch(`${SUPABASE_URL}/rest/v1/mod_treinamento_answers?nome_aluno=eq.${currentStudentName}`, { // Filtra pela PK
                        method: 'PATCH',
                        headers: { 
                            'apikey': SUPABASE_KEY, 
                            'Authorization': `Bearer ${SUPABASE_KEY}`, 
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal' 
                        },
                        body: JSON.stringify(updateData)
                    });
                } else {
                    // Se não existem, crie um novo registro com o writing
                    res = await fetch(`${SUPABASE_URL}/rest/v1/mod_treinamento_answers`, {
                        method: 'POST',
                        headers: { 
                            'apikey': SUPABASE_KEY, 
                            'Authorization': `Bearer ${SUPABASE_KEY}`, 
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(updateData)
                    });
                }

                if (res.ok) {
                    alert("Writing saved! Notifying AI for analysis...");

                    // Limpa o campo de writing após o salvamento
                    document.getElementById('field-writing').value = "";

                    try {
                        await fetch(WEBHOOK_IA, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                action: 'writing_submitted',
                                lessonTitle: lastRecordName,
                                studentName: currentStudentName, // **NOVO:** Passa o nome do aluno
                                writingContent: writingText
                            })
                        });
                        console.log("AI notified about writing submission.");
                    } catch (aiNotifyError) {
                        console.error("Error notifying AI about writing submission:", aiNotifyError);
                    }
                    setTimeout(loadLatestLesson, 500); 
                    requestFeedback(); 

                } else {
                    const errorText = await res.text();
                    alert(`Error saving writing. Check Supabase RLS. Error: ${errorText}`);
                    console.error("Supabase Save Writing Error:", errorText);
                }
            } catch (e) {
                console.error("Fetch Error in saveWriting:", e);
                alert("An error occurred while saving writing.");
            }
        }


        async function requestFeedback() {
            if (!lastRecordName) {
                alert("No lesson title found to request feedback. Please save your answers first.");
                return;
            }
            if (!currentStudentName) {
                alert("Student name not identified. Cannot request feedback.");
                return;
            }
            openTab(null, 'feedback');
            document.getElementById('feedback-area').innerText = "Answers and writing under analysis...";
            
            try {
                await fetch(WEBHOOK_IA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'analyze_feedback', 
                        lessonTitle: lastRecordName,
                        studentName: currentStudentName // **NOVO:** Passa o nome do aluno
                    })
                });
                setTimeout(loadLatestLesson, 3000);
            } catch (e) { 
                console.error("Error requesting feedback:", e); 
                document.getElementById('feedback-area').innerText = "Error requesting feedback. Check console.";
            }
        }

        async function requestManualFeedback() {
            if (!lastRecordName) {
                alert("No lesson title found to request feedback. Please save your answers first.");
                return;
            }
            if (!currentStudentName) {
                alert("Student name not identified. Cannot request manual feedback.");
                return;
            }
            openTab(null, 'feedback');
            document.getElementById('feedback-area').innerText = "Requesting AI feedback...";
            
            try {
                await fetch(WEBHOOK_IA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'request_lesson_feedback', 
                        lessonTitle: lastRecordName,
                        studentName: currentStudentName // **NOVO:** Passa o nome do aluno
                    }) 
                });
                setTimeout(loadLatestLesson, 3000);
            } catch (e) {
                console.error("Error requesting manual feedback from AI:", e);
                document.getElementById('feedback-area').innerText = "Error requesting feedback. Check console.";
            }
        }

        async function generateContent() {
            const cmd = document.getElementById('ai-command').value;
            if (!cmd) return;

            const history = document.getElementById('chat-history');
            
            const uMsg = document.createElement('div');
            uMsg.className = 'msg-user';
            uMsg.innerText = cmd;
            history.appendChild(uMsg);
            
            const bMsg = document.createElement('div');
            bMsg.className = 'msg-bot';
            bMsg.innerText = "Generating lesson... please wait.";
            history.appendChild(bMsg);
            
            document.getElementById('ai-command').value = "";
            history.scrollTop = history.scrollHeight;

            try {
                const response = await fetch(WEBHOOK_IA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instruction: cmd })
                });

                let data;
                let responseText = await response.text();
                try {
                    data = JSON.parse(responseText);
                } catch (jsonError) {
                    console.error("JSON parsing error from AI webhook:", jsonError);
                    console.error("Raw AI webhook response:", responseText);
                    bMsg.innerText = `Error: AI webhook returned invalid JSON. Raw response: ${responseText.substring(0, 100)}...`;
                    return; 
                }

                if (response.ok) {
                    bMsg.innerText = data.output || "Lesson created! Refreshing dashboard...";
                    if (data.studentName) { // **NOVO:** Captura o nome do aluno da resposta da IA
                        currentStudentName = data.studentName;
                        console.log("Current student name set to:", currentStudentName);
                    } else {
                        console.warn("AI webhook response did not contain 'studentName'. It will not be possible to save answers for a specific student.");
                    }
                    setTimeout(loadLatestLesson, 3000);
                } else {
                    bMsg.innerText = `Error: AI could not process the request. ${data.error || responseText || ''}`;
                }
            } catch (e) {
                console.error("Fetch Error:", e);
                bMsg.innerText = "Connection error. Is n8n active?";
            }
        }
    </script>
</body>
</html>
