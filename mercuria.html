<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | MercurIA - Atendimento de Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mercuria-style.css">
</head>
<body>

    <header class="page-header">
        <div class="brand-block">
            <img src="merc_face.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand-text-wrapper">
                <span class="brand-name">VENDISIA</span>
                <span class="brand-tagline">IA ECOSYSTEM</span>
            </div>
        </div>
        <h2 class="header-headline">O silêncio é o ralo do seu investimento em marketing.</h2>
        <div class="spacer"></div>
    </header>

    <main class="main-content">
        <p class="description">
            Enquanto seu comercial não responde, seu cliente compra do concorrente. 
            Teste abaixo a jornada de compra que vai transformar o seu faturamento.
        </p>

        <div class="chat-sandbox">
            <div class="chat-messages" id="chat-box">
                <div class="message bot" id="initial-message">
                    Eu sou MercurIA. Estou processando seus dados...
                </div>
            </div>
            
            <div class="chat-input-area">
                <textarea id="user-input" placeholder="Digite sua mensagem para MercurIA..." rows="1"></textarea>
                <button class="send-button" id="send-btn">ENVIAR</button>
            </div>
        </div>
    </main>

    <script src="mercuria-script.js"></script>
</body>
</html>
