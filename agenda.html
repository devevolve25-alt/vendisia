<!DOCTYPE html>
<html lang="pt-br">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | LITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="agenda.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="agenda.js"></script>  
</head>
<body>

    <header class="page-header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #000; border-bottom: 1px solid rgba(255,255,255,0.1); position: relative;">
    
    <div class="brand-block" style="flex: 1; display: flex; justify-content: flex-start;">
        <img src="" alt="Logo" class="brand-logo" id="salon-logo-display" style="max-height: 40px; width: auto; display: block;">
    </div>
    
    <div class="brand-text-wrapper" style="flex: 2; display: flex; justify-content: center; align-items: center; text-align: center;">
        <span class="brand-name" id="salon-name" style="font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--creative-color); letter-spacing: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            CARREGANDO...
        </span>
    </div>

    <div style="flex: 1; display: flex; justify-content: flex-end;">
        <button onclick="logout()" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 6px 12px; cursor: pointer; font-family: 'Montserrat'; font-size: 0.65rem; border-radius: 4px; font-weight: 600; transition: 0.3s; white-space: nowrap;">
            SAIR
        </button>
    </div>
        
</header>
    <main class="studio-container">
        <section class="chat-column">
            <div class="chat-header">MERCURIA LITE</div>
            <div class="chat-messages" id="chat-criar">
                <div class="msg-bot">Olá. Sou a MercurIA. Como posso gerenciar sua agenda hoje?</div>
            </div>
            <div class="input-area">
                <textarea id="cmd-input" placeholder="Digite seu comando..."></textarea>
                <button class="btn-chat" onclick="generateContent()">ENVIAR COMANDO</button>
            </div>
        </section>

        <section class="preview-column">
            <div class="preview-tabs" id="dynamic-tabs"></div>
            <div class="display-area" id="display-content">
                <div class="proposal-paper" id="text-view">
                    <h1 id="view-title" style="text-align: center; margin-bottom: 20px; font-family: 'Bebas Neue'; color: var(--creative-color);"></h1>
                    
                    <div id="aba-gestao" style="display: none;">
                        <div class="grid-selects-rapidos" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 25px;">
                            <select id="status-estabelecimento" style="padding:10px; background:#000; border:1px solid var(--creative-color); color:#fff; border-radius:5px;">
                                <option value="true">Salão: Aberto</option>
                                <option value="false">Salão: Fechado</option>
                            </select>
                            <select id="select-desativar-servico" style="padding:10px; background:#000; border:1px solid #444; color:#fff; border-radius:5px;">
                                <option value="">Pausar Serviço...</option>
                            </select>
                            <select id="select-desativar-prof" style="padding:10px; background:#000; border:1px solid #444; color:#fff; border-radius:5px;">
                                <option value="">Pausar Profissional...</option>
                            </select>
                        </div>

                        <div class="cards-container-gestao">

                            <div id="container-link-dashboard" style="display: none; margin-bottom: 20px;">
        <a href="dashboard.html" style="display: block; width: 100%; padding: 15px; background: #2ecc71; color: #000; text-align: center; text-decoration: none; font-weight: bold; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem;">
            📊 ACESSAR PAINEL DE GESTÃO TOTAL
        </a>
        <p style="font-size: 0.7rem; color: #888; text-align: center; margin-top: 5px;">Exclusivo para assinantes Plano C</p>
    </div>
                            
                            <div class="service-card" style="margin-bottom: 20px;">
                                <h3>Dados do Empreendedor</h3>
                                <div style="display: flex; flex-direction: column; gap: 10px; margin-top:15px;">
                                    <input type="text" id="perf-nome-completo" placeholder="Nome Completo" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                    <input type="text" id="perf-cpf" placeholder="CPF" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                    <input type="email" id="perf-email-contato" placeholder="E-mail de Contato" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                </div>
                            </div>

                            <div class="service-card" style="margin-bottom: 20px;">
                                <h3>Dados do Estabelecimento</h3>
                                <div style="display: flex; flex-direction: column; gap: 10px; margin-top:15px;">
                                    <input type="text" id="edit-razao-social" placeholder="Razão Social" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                    <input type="text" id="edit-nome-fantasia" placeholder="Nome Fantasia" style="width:100%; padding:10px; background:#000; border:1px solid var(--creative-color); color:#fff;">
                                    <input type="text" id="edit-cnpj" placeholder="CNPJ" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                    <input type="text" id="edit-whatsapp" placeholder="WhatsApp Comercial (Apenas Números)" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                    <input type="text" id="edit-endereco-completo" placeholder="Endereço Completo" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                    
                                    <div style="display: flex; gap: 10px;">
                                        <div style="flex: 1;">
                                            <label style="font-size: 10px; color: var(--creative-color); display: block; margin-bottom: 5px;">ABERTURA</label>
                                            <input type="time" id="edit-hora-abertura" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                        </div>
                                        <div style="flex: 1;">
                                            <label style="font-size: 10px; color: var(--creative-color); display: block; margin-bottom: 5px;">FECHAMENTO</label>
                                            <input type="time" id="edit-hora-fechamento" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                        </div>
                                    </div>
                                    <input type="number" id="edit-intervalo-slot" placeholder="Intervalo (minutos)" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                                    <button id="btn-atualizar-config" class="btn-generate" style="width: 100%; margin-top: 10px;">ATUALIZAR CONFIGURAÇÕES</button>
                                </div>
                            </div>

<div class="service-card" style="margin-bottom: 20px;">
    <h3>Novo Serviço</h3>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top:15px;">
        <input type="text" id="new-servico-nome" placeholder="Nome do Serviço (ex: Corte de Cabelo)" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
        <textarea id="new-servico-desc" placeholder="Descrição para a MercurIA saber como vender este serviço..." style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff; height: 60px; font-family: 'Montserrat';"></textarea>
        
        <div style="display: flex; gap: 10px;">
            <input type="number" id="new-servico-preco" placeholder="Preço (R$)" style="flex:1; padding:10px; background:#000; border:1px solid #444; color:#fff;">
            <input type="number" id="new-servico-duracao" placeholder="Duração (Minutos)" style="flex:1; padding:10px; background:#000; border:1px solid #444; color:#fff;">
        </div>
        
        <button class="btn-generate" id="btn-salvar-servico" style="width: 100%; margin-top: 10px;">+ CADASTRAR SERVIÇO</button>
    </div>
</div>
                            
     <div class="service-card" style="margin-bottom: 20px;">
    <h3>Novo Profissional</h3>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top:15px;">
        <input type="text" id="new-prof-nome" placeholder="Nome do Profissional" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
        <input type="text" id="new-prof-especialidade" placeholder="Especialidade (ex: Barbeiro, Colorista)" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
        <input type="text" id="new-prof-whatsapp" placeholder="WhatsApp do Profissional (com DDD)" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
        
        <div style="display: flex; gap: 10px;">
            <select id="new-prof-tipo-remuneracao" style="flex:1; padding:10px; background:#000; border:1px solid #444; color:#fff;">
                <option value="comissao">Comissão (%)</option>
                <option value="fixo">Salário Fixo</option>
            </select>
            <input type="number" id="new-prof-comissao" placeholder="Valor/Porcentagem" style="flex:1; padding:10px; background:#000; border:1px solid #444; color:#fff;">
        </div>

        <button class="btn-generate" id="btn-salvar-prof" style="width: 100%; margin-top: 10px;">+ CADASTRAR PROFISSIONAL</button>
    </div>
</div>
                        </div>
                    </div> 

                    <div id="view-body"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="modal-agendamento" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; padding: 20px;">
        <div style="background:#111; padding:25px; border:1px solid var(--creative-color); border-radius:10px; width:100%; max-width:400px; font-family:'Montserrat';">
            <h2 style="font-family:'Bebas Neue'; color:var(--creative-color); margin-bottom:15px; letter-spacing: 1px;">Novo Agendamento</h2>
            <p id="info-slot" style="font-size:0.85rem; margin-bottom:20px; color:#888; border-bottom: 1px solid #333; padding-bottom: 10px;"></p>
            
            <div style="display:flex; flex-direction:column; gap:12px;">
                <input type="text" id="agend-nome" placeholder="Seu Nome" style="width:100%; padding:12px; background:#000; border:1px solid #444; color:#fff; border-radius: 4px;">
                <input type="text" id="agend-whatsapp" placeholder="Seu WhatsApp" style="width:100%; padding:12px; background:#000; border:1px solid #444; color:#fff; border-radius: 4px;">
                
                <select id="agend-servico" style="width:100%; padding:12px; background:#000; border:1px solid #444; color:#fff; border-radius: 4px;">
                    <option value="">Selecione o Serviço...</option>
                </select>

                <select id="agend-profissional" style="width:100%; padding:12px; background:#000; border:1px solid #444; color:#fff; border-radius: 4px;">
                    <option value="">Selecione o Profissional...</option>
                </select>

                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button onclick="fecharModal()" style="flex:1; padding:12px; background:#333; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight: 600;">CANCELAR</button>
                    <button onclick="confirmarAgendamento()" style="flex:1; padding:12px; background:var(--creative-color); color:#000; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">CONFIRMAR</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
