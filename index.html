<html lang="pt-br">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | LITE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #000000;
            --chat-bg: #0c1320;
            --creative-color: #d4af37; 
            --gold-glow: rgba(212, 175, 55, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        /* HEADER */
        .page-header {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 15px auto;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
        }

        .brand-block { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 45px; height: auto; }
        .brand-text-wrapper { display: flex; flex-direction: column; }
        .brand-name { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--creative-color); line-height: 0.9; letter-spacing: 2px; }
        .brand-tagline { font-family: 'Bebas Neue'; font-size: 0.9rem; color: #fff; letter-spacing: 3px; margin-top: 3px; }
        .header-headline { font-family: 'Bebas Neue'; font-size: 1.2rem; text-align: center; color: #fff; opacity: 0.8; }

        /* CONTAINER */
        .studio-container {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            min-height: 0;
        }

        /* CHAT */
        .chat-column {
            background: var(--chat-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px;
            background: rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            font-family: 'Bebas Neue';
            font-size: 1.1rem;
            color: var(--creative-color);
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bot { border-left: 2px solid var(--creative-color); padding-left: 10px; color: #cbd5e1; }
        .msg-user { color: var(--creative-color); font-weight: 600; text-align: right; }

        .input-area {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 4px;
            padding: 10px;
            color: white;
            font-family: 'Montserrat';
            resize: none;
            height: 70px;
            outline: none;
        }

        .btn-generate {
            background: var(--creative-color);
            color: #000;
            border: none;
            padding: 10px;
            font-family: 'Bebas Neue';
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
        }

        /* PREVIEW / DISPLAY */
        .preview-column {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            overflow-x: auto;
        }

        .tab {
            padding: 12px 20px;
            font-family: 'Bebas Neue';
            cursor: pointer;
            opacity: 0.5;
            white-space: nowrap;
        }

        .tab.active { opacity: 1; color: var(--creative-color); border-bottom: 2px solid var(--creative-color); }

        .display-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .proposal-paper {
            background: transparent;
            color: #ffffff;
            width: 100%;
            max-width: 850px;
            min-height: 800px;
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
        }

        /* SERVICES GRID */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px var(--gold-glow);
        }

        .service-card h3 { font-family: 'Bebas Neue'; font-size: 1.6rem; color: var(--creative-color); margin-bottom: 10px; }
        .service-card p { font-size: 0.85rem; opacity: 0.7; margin-bottom: 20px; }
        .service-price { font-family: 'Bebas Neue'; font-size: 1.8rem; }

        /* AGENDA TIMELINE (Modo Lista) */
        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .agenda-item {
            display: grid;
            grid-template-columns: 80px 1fr;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px var(--gold-glow);
            transition: all 0.3s ease;
        }

        .agenda-item:hover {
            border-color: var(--creative-color);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .agenda-time {
            font-family: 'Bebas Neue';
            font-size: 1.4rem;
            color: var(--creative-color);
            border-right: 1px solid rgba(212, 175, 55, 0.3);
            padding-right: 10px;
        }

        .agenda-details {
            padding-left: 20px;
        }

        .agenda-details h4 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .agenda-details span {
            font-size: 0.8rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prof-tag {
            background: rgba(212, 175, 55, 0.1);
            color: var(--creative-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-left: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        @media (max-width: 1000px) {
            body { overflow-y: auto; height: auto; }
            .studio-container { grid-template-columns: 1fr; display: flex; flex-direction: column; }
            .chat-column { height: 300px; }
            .preview-column { min-height: 600px; }
        }
    </style>
</head>

    function gerarGradeHorarios(abertura, fechamento, intervalo, agendados) {
    const diasParaGerar = window.periodoAgenda === 'semana' ? 7 : 1;
    const gradeCompleta = [];

    for (let i = 0; i < diasParaGerar; i++) {
        const dataReferencia = new Date();
        dataReferencia.setDate(dataReferencia.getDate() + i);
        const dataISO = dataReferencia.toISOString().split('T')[0];

        let horaAtual = abertura;
        while (horaAtual < fechamento) {
            const dataHoraSlot = `${dataISO}T${horaAtual}:00`;
            
            // Procura se existe agendamento neste dia e hora específica
            const agendamento = agendados.find(a => a.data_hora_inicio.startsWith(`${dataISO}T${horaAtual}`));

            gradeCompleta.push({
                data: dataISO,
                hora: horaAtual,
                dados: agendamento || null
            });

            // Incrementa o horário baseado no intervalo (ex: 09:00 -> 09:30)
            let [h, m] = horaAtual.split(':').map(Number);
            m += intervalo;
            if (m >= 60) { h++; m -= 60; }
            horaAtual = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }
    }
    return gradeCompleta;
}

function generateContent() {
    const input = document.getElementById('cmd-input').value;
    const chat = document.getElementById('chat-criar');
    if(!input) return;
    const div = document.createElement('div'); 
    div.className = 'msg-user'; 
    div.innerText = input;
    chat.appendChild(div);
    document.getElementById('cmd-input').value = "";
    chat.scrollTop = chat.scrollHeight;
}

async function init() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('s');
    if (!slug) {
        document.getElementById('view-body').innerHTML = "<p style='text-align:center'>Slug ausente (?s=slug)</p>";
        return;
    }
    const { data } = await supabaseClient.from('estabelecimentos').select('*').eq('slug', slug).single();

        dadosEstabelecimento = data;
        document.getElementById('salon-name').innerText = data.nome_fantasia;
        setupTabs(); 
    } else {
        document.getElementById('view-body').innerHTML = "<p style='text-align:center'>Salão não encontrado.</p>";
    }
}

            if (window.periodoAgenda === 'semana' && slot.data !== ultimaData) {
                const dataFormatada = new Date(slot.data + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' });
                html += `<div style="grid-column: 1/-1; background: rgba(255,255,255,0.1); padding: 8px; margin-top: 15px; border-radius: 5px; font-size: 0.8em; text-transform: uppercase; color: #2ecc71;">${dataFormatada}</div>`;
                ultimaData = slot.data;
            }

            const exibirPrivado = (userType === 'dono' || userType === 'funcionario');
            const estaOcupado = slot.dados !== null;
            const nomeExibido = estaOcupado ? (exibirPrivado ? slot.dados.cliente_nome : "INDISPONÍVEL") : "DISPONÍVEL";
            const servicoExibido = estaOcupado ? (exibirPrivado ? (slot.dados.servicos?.nome || 'Serviço') : "Horário reservado") : "Toque para agendar";
            const corStatus = estaOcupado ? "#e74c3c" : "#2ecc71";

            html += `
                <div class="agenda-item" style="border-left: 4px solid ${corStatus}; opacity: ${estaOcupado && !exibirPrivado ? '0.6' : '1'}">
                    <div class="agenda-time">${slot.hora}</div>
                    <div class="agenda-details">
                        <h4 style="color: ${estaOcupado ? '#fff' : corStatus}; margin:0;">${nomeExibido}</h4>
                        <span style="font-size: 0.85em; opacity: 0.7;">${servicoExibido}</span>
                    </div>
                </div>`;
        });
        body.innerHTML = htmlFiltros + html + '</div>';
    }

    // --- INSIRA O TRECHO ABAIXO ---
    else if (viewId === 'servicos') {
        title.innerText = "SERVIÇOS";
        const { data } = await supabaseClient.from('servicos').select('*').eq('estabelecimento_id', dadosEstabelecimento.id).order('nome');
        
        // Removi o "let" daqui para evitar o erro de "Identifier 'html' has already been declared"
        html = '<div class="servicos-list" style="padding: 15px;">'; 
        
        data?.forEach(s => {
            html += `
                <div class="servico-card" style="padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                    <div style="text-align: left;">
                        <h4 style="margin: 0; color: #fff;">${s.nome}</h4>
                        <span style="font-size: 0.9em; opacity: 0.6; color: #fff;">${s.duracao || 60} min</span>
                    </div>
                    <div style="font-weight: bold; color: #2ecc71;">R$ ${s.preco}</div>
                </div>`;
        });
        body.innerHTML = html + (data?.length ? '</div>' : '<p style="text-align:center; opacity:0.5">Nenhum serviço cadastrado.</p>');
    }
    // --- FIM DO TRECHO ---
    else {
        title.innerText = viewId.toUpperCase();
        body.innerHTML = `<p style="text-align: center; opacity: 0.5; margin-top: 50px;">Módulo em desenvolvimento...</p>`;
    }
}

// Configuração de Perfis (Constante)
const PERFIS = {
    cliente: [{ id: 'servicos', label: 'SERVIÇOS' }, { id: 'agenda', label: 'AGENDA' }],
    funcionario: [{ id: 'agenda', label: 'MINHA AGENDA' }],
    dono: [{ id: 'servicos', label: 'SERVIÇOS' }, { id: 'agenda', label: 'AGENDA GERAL' }, { id: 'dashboard', label: 'DASHBOARD' }]
};

// Disparo Inicial
window.onload = init;
    </script>
