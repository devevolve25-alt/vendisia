<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | ExplorIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --prospect-color: #32ff7e; /* Verde Perícia */
            --accent-glow: rgba(50, 255, 126, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a150f 0%, #000 100%);
        }

        /* HEADER PADRONIZADO VENDISIA */
        .page-header {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .brand-block { display: flex; align-items: center; gap: 15px; }
        .brand-logo { width: 50px; height: auto; }
        .brand-text-wrapper { display: flex; flex-direction: column; }
        .brand-name { font-family: 'Bebas Neue'; font-size: 2.5rem; color: var(--prospect-color); line-height: 0.9; letter-spacing: 2px; }
        .brand-tagline { font-family: 'Bebas Neue'; font-size: 1.2rem; color: #fff; letter-spacing: 4px; margin-top: 5px; }

        /* CONTAINER CENTRAL DE DIAGNÓSTICO */
        .main-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* EFEITO DE RADAR AO FUNDO */
        .radar-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            border: 1px solid rgba(50, 255, 126, 0.1);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border-top: 2px solid var(--prospect-color);
            opacity: 0.3;
            animation: rotate 4s linear infinite;
            display: none;
        }

        /* ESTILIZAÇÃO DOS LINKS COMO BOTÕES (VERDE) */
        .msg-bot a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background-color: var(--prospect-color) !important;
            color: #000 !important;
            text-decoration: none;
            border-radius: 6px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .msg-bot a:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* CAIXA DE CHAT CENTRALIZADA */
        .central-chat {
            width: 100%;
            max-width: 550px;
            background: rgba(12, 20, 16, 0.8);
            border: 1px solid rgba(50, 255, 126, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(50, 255, 126, 0.1);
            text-align: center;
        }

        .chat-header h1 { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--prospect-color); letter-spacing: 2px; }

        .chat-display {
            height: 300px;
            padding: 25px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .msg-bot { margin-bottom: 20px; border-left: 2px solid var(--prospect-color); padding-left: 15px; }
        .msg-user { color: var(--prospect-color); font-weight: 600; text-align: right; margin-bottom: 20px; }
