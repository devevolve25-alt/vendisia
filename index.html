<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDISIA | Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --creative-color: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Bebas Neue';
            font-size: clamp(2.5rem, 8vw, 5rem); /* Ajusta conforme o tamanho da tela */
            color: var(--creative-color);
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .btn-acesso {
            display: inline-block;
            padding: 15px 40px;
            font-family: 'Bebas Neue';
            font-size: 1.5rem;
            color: #000;
            background-color: var(--creative-color);
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .btn-acesso:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--creative-color);
        }

        /* Efeito sutil de movimento no fundo */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--gold-glow);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="hero-container">
        <h1>VENDISIA - VENDAS E AGENDAMENTOS</h1>
        <a href="https://vendisia.ia.br/acesso.html" class="btn-acesso">ENTRAR NO SISTEMA</a>
    </div>

</body>
</html>
